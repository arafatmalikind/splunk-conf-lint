[Historian - Alarm flood]
enableSched = 1
cron_schedule = */15 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
search = index=ot sourcetype=historian:events severity=critical | stats count by tagname | where count > 50
action.email = 1

[Historian - Daily tag summary]
enableSched = 1
cron_schedule = 0 6 * * *
search = sourcetype=historian:events | stats dc(tagname)

[Historian - Everything]
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -24h
search = index=* historian

[Historian - Broken cron]
enableSched = 1
cron_schedule = */5 * * *
dispatch.earliest_time = -5m

[Historian - Realtime]
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = rt-1m
dispatch.latest_time = rt
search = index=ot sourcetype=historian:audit
