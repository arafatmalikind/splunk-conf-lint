[plant:fw:syslog]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^<\d+>
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 20
TRUNCATE = 10000
EVENT_BREAKER_ENABLE = true
EVENT_BREAKER = ([\r\n]+)
REPORT-kv = fw_kv
LOOKUP-zone = fw_zone_lookup src_zone OUTPUT zone_level
EXTRACT-action = action=(?<action>allow|deny|drop)
