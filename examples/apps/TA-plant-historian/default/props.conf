[historian:events]
TIME_FORMAT = %Y-%m-%d %H:%M:%S.%3N
LINE_BREAKER = \r?\n
SHOULD_LINEMERGE = true
REPORT-fields = historian_kv, historian_tagname
TRANSFORMS-route = route_alarms_to_ot

[historian:audit]
EXTRACT-user = user=\w+
EXTRACT-action = action=(?<action>[a-z_]+

[historian:json]
INDEXED_EXTRACTIONS = json

[source::/var/log/historian/*.log]
sourcetype = historian:events
